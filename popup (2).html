<p><!DOCTYPE html> <html lang=&quot;en&quot;> <head>  <meta charset=&quot;UTF-8&quot;>  <title>Update Lead Popup</title>  <style>  body { font-family: Arial, sans-serif; padding: 20px; background: #fff; }  .form-group { margin-bottom: 15px; }  label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }  input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }  button { background: #0066cc; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }  button:hover { background: #0055b3; }  </style> </head> <body>  <h3>Update Lead Details</h3>  <div class=&quot;form-group&quot;>  <label>Lead Status</label>  <select id=&quot;leadStatus&quot;>  <option value=&quot;Not Contacted&quot;>Not Contacted</option>  <option value=&quot;Contacted&quot;>Contacted</option>  <option value=&quot;Qualified&quot;>Qualified</option>  </select>  </div>  <div class=&quot;form-group&quot;>  <label>Description / Notes</label>  <input type=&quot;text&quot; id=&quot;leadDescription&quot; placeholder=&quot;Enter notes...&quot;>  </div>  <button onclick=&quot;updateLead()&quot;>Submit &amp; Update</button></p>

<p> <script src=&quot;https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js&quot;></script>  <script>  let currentLeadId = null;</p>

<p> ZOHO.embeddedApp.on(&quot;PageLoad&quot;, function(data) {  // Capture the Entity ID from the button trigger  currentLeadId = data.EntityId;  });</p>

<p> ZOHO.embeddedApp.init();</p>

<p> function updateLead() {  var status = document.getElementById(&quot;leadStatus&quot;).value;  var desc = document.getElementById(&quot;leadDescription&quot;).value;</p>

<p> var updateData = {  Entity: &quot;Leads&quot;,  APIData: {  &quot;id&quot;: currentLeadId,  &quot;Lead_Status&quot;: status,  &quot;Description&quot;: desc  }  };</p>

<p> ZOHO.CRM.API.updateRecord(updateData).then(function(data){  console.log(data);  // Close the popup/modal and refresh the page  ZOHO.CRM.UI.Popup.close().then(function(){  ZOHO.CRM.UI.Record.reload();  });  }).catch(function(err){  alert(&quot;Failed to update record: &quot; + JSON.stringify(err));  });  }  </script> </body> </html></p>
